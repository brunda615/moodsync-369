<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MoodSync</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Galaxy Background -->
    <div class="stars"></div>
    <div class="twinkling"></div>

    <nav>
        <h2 class="logo">MoodSync</h2>
        <button id="resetBtn">Reset</button>
    </nav>

    <section class="hero">
        <h1>How Are You Feeling Today?</h1>

        <div class="mood-buttons">
            <button class="mood" data-mood="joy">😄 Joy</button>
            <button class="mood" data-mood="sadness">😢 Sadness</button>
            <button class="mood" data-mood="anger">😡 Anger</button>
            <button class="mood" data-mood="fear">😨 Fear</button>
            <button class="mood" data-mood="disgust">🤢 Disgust</button>
            <button class="mood" data-mood="envy">😏 Envy</button>
            <button class="mood" data-mood="embarrassment">😳 Embarrassment</button>
            <button class="mood" data-mood="anxiety">😰 Anxiety</button>
        </div>

        <div class="output">
            <h2 id="moodTitle">Select your mood</h2>
            <p id="moodQuote">The universe will transform around your emotion.</p>
        </div>
    </section>

    <footer>
        <p>Interactive experience built using HTML, CSS & JavaScript</p>
    </footer>

<script src="script.js"></script>
</body>
</html>
